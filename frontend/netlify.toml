# Netlify Configuration for Vite + React SPA

[build]
  publish = "dist"
  command = "npm run build"

# Redirect all frontend routing paths to index.html for Single Page App support
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy API requests to the deployed backend server (e.g., on Render or Railway)
# Once your backend is deployed, replace the 'to' URL with your backend service URL.
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-render-url.onrender.com/api/:splat"
  status = 200
  force = true
